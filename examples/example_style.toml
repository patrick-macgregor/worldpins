sea = "#a0d8eb"
land = "#daf7e3"
font_family = "Aptos"
border_colour = "#afbacb"
border_width = 0.4
pin_colour = ["crimson","blue"]
label_colour = ["black", "black"]
key = ["ISOL-type facilities", "In-flight-type facilities"]
